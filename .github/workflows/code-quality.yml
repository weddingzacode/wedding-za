name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"

jobs:
  syntax:
    name: PHP JavaScript and JSON syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo, mbstring, curl

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name "*.php" -print0)

      - name: Check launch security regressions
        run: php scripts/qa-launch-security.php

      - name: Check policy installer safety
        run: php scripts/qa-policy-update.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/vision.js

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('assets/data/site.json', 'utf8')); console.log('site.json OK')"

  integration:
    name: MySQL and HTTP smoke test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wedding_za
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo, mbstring, curl

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Import database schema
        run: |
          mysql             --host=127.0.0.1             --port=3306             --user=root             --password=root             wedding_za             < database/schema.sql

      - name: Create CI configuration
        run: |
          cat > config.local.php <<'PHP'
          <?php

          return [
              'app_url' => 'http://127.0.0.1:8088',
              'database' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'wedding_za',
                  'user' => 'root',
                  'password' => 'root',
                  'charset' => 'utf8mb4',
              ],
              'analytics' => [
                  'measurement_id' => '',
              ],
              'seo' => [
                  'organization_name' => 'Wedding Za',
                  'default_og_image' => '',
                  'contact_email' => '',
                  'contact_phone' => '',
              ],
              'operations' => [
                  'health_token' => 'ci-health-token',
              ],
          ];
          PHP

      - name: Check application and database time zones
        run: php scripts/qa-timezone.php

      - name: Run CRM integration QA
        run: |
          php scripts/qa-crm.php

      - name: Run Venue CRM operations QA
        run: |
          php scripts/qa-venue-crm.php

      - name: Run Admin CRM operations QA
        run: |
          php scripts/qa-admin-crm.php

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8088 > /tmp/wedding-za-php.log 2>&1 &
          echo $! > /tmp/wedding-za-php.pid
          sleep 2

      - name: Run HTTP smoke tests
        run: |
          bash scripts/qa-smoke.sh http://127.0.0.1:8088

      - name: Show PHP server log on failure
        if: failure()
        run: |
          if [ -f /tmp/wedding-za-php.log ]; then
            cat /tmp/wedding-za-php.log
          else
            echo "PHP server had not started before the failure."
          fi


  browser:
    name: Chromium desktop and mobile smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo, mbstring, curl

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install QA dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run browser QA
        run: |
          npm run test:e2e
